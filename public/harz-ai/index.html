<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARZ AI — Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#1a1a1a;--bubble:#2a2a2a;--text:#e0e0e0;--accent:#00ff88;--accent2:#00cc6a;--dim:#666}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--card);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;flex-shrink:0}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000;font-size:16px}
.header h1{font-size:16px;font-weight:600}
.header .status{font-size:11px;color:var(--accent);margin-left:auto}
.header .status.offline{color:#ff4444}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#000;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--bubble);border:1px solid #333;border-bottom-left-radius:4px}
.msg.ai.thinking{color:var(--dim);font-style:italic}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:bounce .6s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.input-area{background:var(--card);padding:12px;border-top:1px solid #333;display:flex;gap:8px;flex-shrink:0}
#input{flex:1;background:var(--bubble);border:1px solid #333;border-radius:20px;padding:10px 16px;color:var(--text);font-size:14px;outline:none}
#input:focus{border-color:var(--accent)}
#send{background:var(--accent);color:#000;border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:18px;flex-shrink:0;transition:transform .2s}
#send:active{transform:scale(0.9)}
#send:disabled{background:#333;color:#666;cursor:not-allowed}
.lang-toggle{background:#333;border:none;color:var(--text);padding:4px 8px;border-radius:8px;font-size:11px;cursor:pointer}
.quick{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
.quick button{background:#222;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:12px;font-size:12px;cursor:pointer;white-space:nowrap}
.quick button:active{background:#333}
</style>
</head>
<body>
<div class="header">
<div class="logo">H</div>
<h1>HARZ AI</h1>
<span class="lang-toggle" onclick="toggleLang()">EN/HA/PID</span>
<span class="status" id="status">● Online</span>
</div>
<div id="chat">
<div class="msg ai">Sannu! Ni HARZ AI ne. Ina taimaka maka da duk wani abu akan HARZ Digital Services — products, payments, platforms, ko duk wani tambaya. Yaya zan iya taimaka maka?</div>
</div>
<div class="quick">
<button onclick="quickAsk('Who are you?')">Who are you?</button>
<button onclick="quickAsk('How much are the books?')">Book prices?</button>
<button onclick="quickAsk('What payment methods?')">Payments?</button>
<button onclick="quickAsk('Wane ne kai?')">Wane ne kai?</button>
</div>
<div class="input-area">
<input id="input" placeholder="Rubuta message..." onkeydown="if(event.key==='Enter')send()">
<button id="send" onclick="send()">→</button>
</div>
<script>
const API='https://harz-cloud-backend.onrender.com/bridge/agent-chat';
const KEY='harz_cloud_live_321424';
let busy=false;

async function send(){
  if(busy)return;
  const input=document.getElementById('input');
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  addMsg(msg,'user');
  const think=addMsg('','ai thinking');
  think.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  busy=true;
  document.getElementById('send').disabled=true;
  try{
    const r=await fetch(API,{method:'POST',headers:{'x-api-key':KEY,'Content-Type':'application/json'},body:JSON.stringify({message:msg,agent:'harz-ai'})});
    const d=await r.json();
    think.classList.remove('thinking');
    think.textContent=d.response||d.message||'No response. Try again.';
  }catch(e){
    think.classList.remove('thinking');
    think.textContent='Connection error. HARZ Cloud may be waking up. Try again.';
    document.getElementById('status').textContent='● Reconnecting';
    document.getElementById('status').classList.add('offline');
  }
  busy=false;
  document.getElementById('send').disabled=false;
  document.getElementById('chat').scrollTop=99999;
}

function addMsg(text,cls){
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.textContent=text;
  c.appendChild(d);
  c.scrollTop=99999;
  return d;
}

function quickAsk(q){
  document.getElementById('input').value=q;
  send();
}

function toggleLang(){
  alert('HARZ AI supports English, Hausa, and Pidgin.\nJust type in any language and I will respond in kind.');
}

// Wake up HARZ Cloud on load
fetch(API,{method:'POST',headers:{'x-api-key':KEY,'Content-Type':'application/json'},body:JSON.stringify({message:'ping',agent:'harz-ai'})}).catch(()=>{});
</script>
</body>
</html>
